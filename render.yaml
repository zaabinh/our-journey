# Free demo deployment. Render Free Postgres expires after 30 days.
# R2 is billed separately if usage exceeds its free allowance.
services:
  - type: web
    name: our-journey-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Free web services do not support preDeployCommand.
    # This single-instance demo applies migrations before starting the API.
    startCommand: >-
      uv run --no-sync alembic upgrade head &&
      exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: OJ_DATABASE_URL
        fromDatabase:
          name: our-journey-db
          property: connectionString
      - key: OJ_ENVIRONMENT
        value: production
      - key: OJ_STORAGE_DRIVER
        value: r2
      - key: OJ_ALLOWED_ORIGINS
        sync: false
      - key: OJ_R2_ENDPOINT
        sync: false
      - key: OJ_R2_BUCKET
        sync: false
      - key: OJ_R2_ACCESS_KEY
        sync: false
      - key: OJ_R2_SECRET_KEY
        sync: false

databases:
  - name: our-journey-db
    databaseName: journey
    user: journey
    plan: free
    postgresMajorVersion: "16"
    # Only services in Render's private network can connect.
    ipAllowList: []
