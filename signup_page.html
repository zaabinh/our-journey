<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style_login.css" rel="stylesheet">
    <link rel="icon" href="assets/icon/love.png" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon/love.png">
    <title>Sign up - Our Journey</title>
</head>
<body>
  <header>
        <div class="navbar-box">
            <div id="site-icon-title">
                <img src="assets/icon/love.png" class="site-icon">
                <h1 class="site-title">Our Journey</h1>
            </div>
            <nav>
                <ul class="navbar" style="margin: 0;">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="album.html">Album</a></li>
                    <li id="nav-login"><a href="login_page.html">Login</a></li>
                    <li id="nav-signup"><a href="signup_page.html">Sign Up</a></li>
                    <li id="nav-user" style="display:none;">
                        <a id="nav-username" href="profile.html"></a>
                        <button id="nav-signout">Sign Out</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
  <main>
    <div class="login">
      <form id="signupForm" class="login-form">
        <h1>SIGN UP</h1>
        <div class="form-group">
          <label for="signupUsername">Username:</label>
          <input id="signupUsername" name="username" type="text" required>
          <div class="error-message" id="signupUsernameError"></div>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password:</label>
          <input id="signupPassword" name="password" type="password" required>
          <div class="password-strength" id="passwordStrength"></div>
          <div class="error-message" id="signupPasswordError"></div>
        </div>
        <div class="form-group">
          <label for="signupConfirmPassword">Confirm Password:</label>
          <input id="signupConfirmPassword" name="confirmPassword" type="password" required>
          <div class="error-message" id="signupConfirmPasswordError"></div>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email:</label>
          <input id="signupEmail" name="email" type="email" required>
          <div class="error-message" id="signupEmailError"></div>
        </div>
        <a href="login_page.html" style="margin-left:8px; color:#590d22; text-decoration:underline">Log in</a>
        <div class="form-group">
          <button type="submit" class="submit" id="signupSubmit">Create account</button>
        </div>
      </form>
    </div>
  </main>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
