services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey
      POSTGRES_DB: journey
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - journey_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journey"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  journey_db:
