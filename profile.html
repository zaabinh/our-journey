<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style_login.css" rel="stylesheet">
    <link rel="icon" href="assets/icon/love.png" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon/love.png">
    <title>Profile - Our Journey</title>
</head>
<body>
    <header>
        <div class="navbar-box">
            <div id="site-icon-title">
                <img src="assets/icon/love.png" class="site-icon">
                <h1 class="site-title">Our Journey</h1>
            </div>
            <nav>
                <ul class="navbar" style="margin: 0;">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="album.html">Album</a></li>
                    <li id="nav-login"><a href="login_page.html">Login</a></li>
                    <li id="nav-signup"><a href="signup_page.html">Sign Up</a></li>
                    <li id="nav-user" style="display:none;">
                        <span id="nav-username"></span>
                        <button id="nav-signout">Sign Out</button>
                        <a href="profile.html">Profile</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="login">
            <form id="profileForm" class="login-form">
                <h1>PROFILE</h1>
                <div class="form-group">
                    <label for="profileAvatar">Avatar:</label>
                    <input type="file" id="profileAvatar" accept="image/*">
                    <img id="avatarPreview" src="assets/icon/user.png" alt="Avatar" style="width: 100px; height: 100px; border-radius: 50%; margin-top: 10px;">
                </div>
                <div class="form-group">
                    <label for="profileUsername">Username:</label>
                    <input id="profileUsername" name="username" type="text" readonly>
                </div>
                <div class="form-group">
                    <label for="profileEmail">Email:</label>
                    <input id="profileEmail" name="email" type="email" required>
                    <div class="error-message" id="profileEmailError"></div>
                </div>
                <div class="form-group">
                    <label for="profileNewPassword">New Password:</label>
                    <input id="profileNewPassword" name="newPassword" type="password">
                    <div class="password-strength" id="profilePasswordStrength"></div>
                    <div class="error-message" id="profileNewPasswordError"></div>
                </div>
                <div class="form-group">
                    <label for="profileConfirmPassword">Confirm New Password:</label>
                    <input id="profileConfirmPassword" name="confirmPassword" type="password">
                    <div class="error-message" id="profileConfirmPasswordError"></div>
                </div>
                <div class="form-group">
                    <button type="submit" class="submit" id="profileSubmit">Update Profile</button>
                </div>
            </form>
        </div>
        <script src="auth.js"></script>
        <script src="script.js"></script>
    </main>
</body>
</html>
